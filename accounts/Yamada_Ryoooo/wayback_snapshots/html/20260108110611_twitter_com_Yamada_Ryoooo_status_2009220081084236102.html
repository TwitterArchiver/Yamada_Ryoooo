  粗长我说时间短，勃起我说太敏感，包皮我说发育慢，生气我说你像处男。
  <br/>
  嘲讽这块我没输过谁。
  <br/>
  套里的O液少我就笑你能力太差射太少，套里的O液多我就笑你太敏感射太多。
  <br/>
  虽然最后结局都是在床上当母狗，但嘴上我没输过就行。
  <br/>
  犹记盛夏雨夜，屋内空调压的极低，我在窗边被反剪着双手跪着后入，半身贴在冰冰凉凉的玻璃上喘息，感受雨的温度。
  <br/>
  玻璃外，雨水在窗户上成股流下，被我身后撞击震散变成水滴，再无踪迹。
  <br/>
  玻璃内，我不自觉流出的唾液泪水滴在了大理石窗台上，混着淫水再也分辨不开。
  <br/>
  爽到永生难忘。
